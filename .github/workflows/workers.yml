name: Workers

on:
  push:
    paths: &workers
      - "browser-worker/**"
      - "kotatsu-worker/**"
      - ".github/workflows/workers.yml"
  pull_request:
    paths: *workers

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile browser-worker/app.py
      - run: docker build browser-worker

  kotatsu-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew --no-daemon build
        working-directory: kotatsu-worker
      - run: docker build kotatsu-worker
