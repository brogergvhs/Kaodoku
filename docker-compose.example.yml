services:
  kaodoku:
    build: .
    command:
      - serve
      - --addr
      - :8080
      - --db
      - /data/kaodoku.db
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      XDG_CONFIG_HOME: /config
      KAODOKU_DOWNLOAD_DIR: /downloads
    volumes:
      - kaodoku-config:/config
      - kaodoku-data:/data
      - kaodoku-downloads:/downloads
    # Uncomment depends_on and the entry for each helper service you enable
    # below, so Kaodoku starts after it.
    # depends_on:
    #   browser-worker:
    #     condition: service_healthy
    #   flaresolverr:
    #     condition: service_started

  # Optional helper services. To turn one on, uncomment its
  # block here and its variables in .env, then its depends_on entry above.

  # FlareSolverr clears Cloudflare challenges. In .env: KAODOKU_BROWSER_SOLVER_*.
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   environment:
  #     LOG_LEVEL: info
  #   ports:
  #     - "127.0.0.1:8191:8191"

  # selenium + browser-worker render JavaScript-heavy readers; enable both.
  # In .env: KAODOKU_BROWSER_DOWNLOADER_*.
  # selenium:
  #   image: selenium/standalone-chromium:latest
  #   shm_size: 4gb
  #   environment:
  #     SE_NODE_MAX_SESSIONS: "4"
  #     SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
  #   ports:
  #     - "127.0.0.1:4444:4444"
  #
  # browser-worker:
  #   build: ./browser-worker
  #   environment:
  #     SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
  #     BROWSER_WORKER_ADDR: 0.0.0.0:8192
  #     BROWSER_WORKER_KEY: ${KAODOKU_BROWSER_DOWNLOADER_API_KEY:-}
  #   depends_on:
  #     selenium:
  #       condition: service_started
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8192/health').read()"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # kotatsu-worker adds ~1300 sources via kotatsu-parsers (see
  # kotatsu-worker/README.md). In .env: KAODOKU_KOTATSU_WORKER_*.
  # kotatsu-worker:
  #   build: ./kotatsu-worker
  #   restart: unless-stopped
  #   mem_limit: 384m
  #   environment:
  #     WORKER_KEY: ${KAODOKU_KOTATSU_WORKER_API_KEY}
  #     # With flaresolverr enabled, lets the worker clear Cloudflare challenges.
  #     # It must share the worker's egress IP, so run it next to this service.
  #     # FLARESOLVERR_URL: http://flaresolverr:8191
  #     # With browser-worker enabled, lets parsers that need JavaScript run it
  #     # there (same egress-IP caveat).
  #     # BROWSER_WORKER_URL: http://browser-worker:8192
  #     # BROWSER_WORKER_KEY: ${KAODOKU_BROWSER_DOWNLOADER_API_KEY:-}
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8484/healthz"]
  #     interval: 30s
  #     timeout: 5s
  #     start_period: 30s

# tools:
#   image: alpine:latest
#   profiles: ["tools"]
#   volumes:
#     - kaodoku-config:/config
#     - kaodoku-data:/data
#     - kaodoku-downloads:/downloads

volumes:
  kaodoku-config:
  kaodoku-data:
  kaodoku-downloads:
